<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Interrupted | Atharvax</title>
    <meta name="theme-color" content="#0b0f19">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0b0f19;
            color: var(--color-text);
            overflow: hidden;
            font-family: var(--font-body);
        }
        .offline-container {
            text-align: center;
            max-width: 480px;
            padding: var(--space-2xl);
            margin: var(--space-lg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--glass-shadow);
            animation: fadeIn 0.6s ease;
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            background: var(--color-primary-alpha);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-xl);
            color: var(--color-primary);
            position: relative;
        }
        .offline-icon svg {
            width: 40px;
            height: 40px;
        }
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--color-primary);
            border-radius: 50%;
            animation: pulse 2s infinite ease-in-out;
            opacity: 0;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .btn-retry {
            width: 100%;
            margin-top: var(--space-lg);
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.9rem;
            border-radius: var(--radius-full);
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-green), var(--shadow-md);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
        .offline-logo {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: var(--space-md);
            letter-spacing: -0.5px;
        }
        .logo-dot {
            color: var(--color-primary);
            text-shadow: 0 0 10px var(--color-primary);
        }
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-bottom: var(--space-lg);
        }
        .toast {
            position: fixed;
            bottom: var(--space-xl);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ef4444;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow-md);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-logo">Atharvax<span class="logo-dot">.</span></div>
        <span class="status-badge">Offline Mode</span>
        
        <div class="offline-icon">
            <div class="pulse-ring"></div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-3.536 4.978 4.978 0 011.414-3.536m0 0L8.464 8.464M5.636 5.636a9 9 0 000 12.728m0 0L3 21m0 0h4m-4 0v-4" />
            </svg>
        </div>

        <h2 style="font-size: 1.6rem; margin-bottom: var(--space-sm); font-weight: 700;">No Connection Detected</h2>
        <p style="color: var(--color-text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: var(--space-lg);">
            It seems you've lost your network connection. Check your device's cellular settings or Wi-Fi network and try again.
        </p>

        <button class="btn-retry" id="retryBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
            Retry Connection
        </button>
    </div>

    <div class="toast" id="toast">Still offline. Please check your connection.</div>

    <script>
        document.getElementById('retryBtn').addEventListener('click', function() {
            const btn = this;
            const originalHTML = btn.innerHTML;
            
            // Add loading spinner state
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin" style="animation: spin 1s linear infinite;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg> Checking Connection...`;
            
            // Add spin keyframes if not present
            if (!document.getElementById('spin-style')) {
                const style = document.createElement('style');
                style.id = 'spin-style';
                style.innerHTML = `@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`;
                document.head.appendChild(style);
            }

            setTimeout(() => {
                if (navigator.onLine) {
                    // Try to go back or go home
                    window.location.reload();
                } else {
                    // Show toast
                    const toast = document.getElementById('toast');
                    toast.classList.add('show');
                    setTimeout(() => {
                        toast.classList.remove('show');
                    }, 3000);
                    
                    // Reset button
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                }
            }, 1000);
        });

        // Auto-refresh when coming back online
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
